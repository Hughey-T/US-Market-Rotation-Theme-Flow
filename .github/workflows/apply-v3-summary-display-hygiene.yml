name: apply-v3-summary-display-hygiene

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/v3-summary-dedup-and-display-hygiene' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3-summary-dedup-and-display-hygiene
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source, instruction, and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('rotation/analysis_v3.py')
          text = source.read_text(encoding='utf-8')
          old = '"research_priorities":[c["theme_id"] for c in candidates[:3]],"classification_summary":classification,'
          new = '"research_priorities":list(dict.fromkeys(c["theme_id"] for c in candidates))[:3],"classification_summary":classification,'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected research priority pattern count: {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          instructions = Path('docs/custom_gpt_instructions_current.md')
          text = instructions.read_text(encoding='utf-8')
          if text.count('正本指示 1.7.2') != 1:
              raise SystemExit('unexpected instruction version marker')
          text = text.replace('正本指示 1.7.2', '正本指示 1.7.3', 1)
          needle = 'Phase1と6で「本分析でいうflowは、価格、相対強度、breadthなどから観測したローテーションの兆候であり、直接的な資金流入額・流出額を示すものではありません。」を表示する。\n\n## 互換性'
          replacement = 'Phase1と6で「本分析でいうflowは、価格、相対強度、breadthなどから観測したローテーションの兆候であり、直接的な資金流入額・流出額を示すものではありません。」を表示する。\n\n通常回答ではmanifest、inventory、part、fragment、bytes、SHA-256、identity、canonical hash、source_fields、used_datesなどの内部検証・追跡値を表示しない。これらは検証には使用するが、利用者が検証方法を質問した場合だけ簡潔に説明する。Phase3の相関はobservation_countと相関値を表示し、長いused_dates配列は省略する。\n\n## 互換性'
          if text.count(needle) != 1:
              raise SystemExit('display hygiene insertion point not found')
          text = text.replace(needle, replacement)
          if len(text) > 8000:
              raise SystemExit(f'instructions exceed 8000 chars: {len(text)}')
          instructions.write_text(text, encoding='utf-8')

          for name in (
              'tests/test_custom_gpt_sequential_fetch_budget.py',
              'tests/test_custom_gpt_stale_cache_contract.py',
          ):
              path = Path(name)
              value = path.read_text(encoding='utf-8')
              if '正本指示 1.7.2' not in value:
                  raise SystemExit(f'version marker missing in {name}')
              path.write_text(value.replace('正本指示 1.7.2', '正本指示 1.7.3'), encoding='utf-8')

          regression = Path('tests/test_v3_summary_display_hygiene.py')
          regression.write_text('''import unittest\nfrom pathlib import Path\n\nfrom rotation.analysis_v3 import build_authoritative_v3\nfrom tests.test_publication_contract import generation\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass V3SummaryDisplayHygieneTests(unittest.TestCase):\n    def test_research_priorities_are_unique_by_theme_in_first_seen_order(self):\n        snapshot = generation("2026-07-17", "summary-theme-dedup")\n        theme_id = next(iter(snapshot["themes"]))\n        theme_label = snapshot["themes"][theme_id].get("label", theme_id)\n        snapshot["company_candidates"] = [\n            {\n                "theme_id": theme_id,\n                "theme_label": theme_label,\n                "ticker": "AAA",\n                "company_name": None,\n                "selection_role": "representative",\n                "why": "representative check",\n                "key_check": "primary check",\n                "counter_evidence": "counter evidence",\n            },\n            {\n                "theme_id": theme_id,\n                "theme_label": theme_label,\n                "ticker": "BBB",\n                "company_name": None,\n                "selection_role": "breadth_check",\n                "why": "breadth check",\n                "key_check": "secondary check",\n                "counter_evidence": "secondary counter evidence",\n            },\n        ]\n        priorities = build_authoritative_v3(snapshot)["phases"][6]["research_priorities"]\n        self.assertEqual(priorities, [theme_id])\n        self.assertEqual(len(priorities), len(set(priorities)))\n\n    def test_instructions_hide_transport_and_long_trace_values_by_default(self):\n        text = (ROOT / "docs" / "custom_gpt_instructions_current.md").read_text(encoding="utf-8")\n        self.assertLessEqual(len(text), 8000)\n        for required in (\n            "正本指示 1.7.3",\n            "内部検証・追跡値を表示しない",\n            "長いused_dates配列は省略する",\n            "利用者が検証方法を質問した場合だけ簡潔に説明する",\n        ):\n            self.assertIn(required, text)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          workflow = Path('.github/workflows/apply-v3-summary-display-hygiene.yml')
          workflow.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rotation/analysis_v3.py docs/custom_gpt_instructions_current.md tests/test_custom_gpt_sequential_fetch_budget.py tests/test_custom_gpt_stale_cache_contract.py tests/test_v3_summary_display_hygiene.py .github/workflows/apply-v3-summary-display-hygiene.yml
          git commit -m "Deduplicate v3 research themes and hide transport details"
          git push origin HEAD:fix/v3-summary-dedup-and-display-hygiene
