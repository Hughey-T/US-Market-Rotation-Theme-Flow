name: apply-consumer-v3-fragment-compaction

on:
  push:
    branches:
      - fix/consumer-v3-fragment-compaction
    paths:
      - .github/workflows/apply-consumer-v3-fragment-compaction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consumer-v3-fragment-compaction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch implementation and add regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("rotation/consumer_v3.py")
          text = path.read_text(encoding="utf-8")

          old = '''PART_TARGET_BYTES = 12 * 1024
          RESERVED_PREFIXES = ("進行状態:",)
          '''
          new = '''PART_TARGET_BYTES = 12 * 1024
          FRAGMENT_TARGET_BYTES = 9 * 1024
          RESERVED_PREFIXES = ("進行状態:",)
          '''
          if old not in text:
              raise SystemExit("constant anchor not found")
          text = text.replace(old, new, 1)

          anchor = '''def _chunks(view: dict, identity: dict, kind: str, phase: int) -> list[dict]:
              fragments = _flatten_fragments(view)
              if len(fragments) > MAX_PHASE_FRAGMENTS: raise ContractError("fragment limit exceeded")
          '''
          replacement = '''def _escape_pointer_token(value: str) -> str:
              return value.replace("~", "~0").replace("/", "~1")


          def _compact_fragments(value, path: str = "") -> list[dict]:
              """Flatten a view while retaining bounded subtrees as one fragment.

              The v2 leaf projection remains the fallback for oversized containers,
              scalar values, and long text.  Reconstruction is byte-semantic: compact
              fragments carry the exact original JSON subtree and never summarize it.
              """
              pointer = path or "/"
              if isinstance(value, (dict, list)) and value:
                  candidate = {"field": pointer, "value": copy.deepcopy(value)}
                  if len(canonical_bytes(candidate)) <= FRAGMENT_TARGET_BYTES:
                      return [candidate]

                  fragments: list[dict] = []
                  if isinstance(value, dict):
                      for key, item in value.items():
                          child = f"{path}/{_escape_pointer_token(str(key))}"
                          fragments.extend(_compact_fragments(item, child))
                  else:
                      for index, item in enumerate(value):
                          child = f"{path}/{index}"
                          fragments.extend(_compact_fragments(item, child))
                  return fragments

              return _flatten_fragments(value, path)


          def _chunks(view: dict, identity: dict, kind: str, phase: int) -> list[dict]:
              fragments = _compact_fragments(view)
              if len(fragments) > MAX_PHASE_FRAGMENTS:
                  raise ContractError(
                      f"{kind} fragment limit exceeded for phase {phase}: "
                      f"{len(fragments)} > {MAX_PHASE_FRAGMENTS}"
                  )
          '''
          if anchor not in text:
              raise SystemExit("chunks anchor not found")
          text = text.replace(anchor, replacement, 1)

          old = '''        if phase["fragment_count"] + detail["fragment_count"] > MAX_PHASE_FRAGMENTS: raise ContractError("combined phase fragment limit exceeded")
          '''
          new = '''        combined_fragments = phase["fragment_count"] + detail["fragment_count"]
                  if combined_fragments > MAX_PHASE_FRAGMENTS:
                      raise ContractError(
                          f"combined fragment limit exceeded for phase {phase['phase']}: "
                          f"{combined_fragments} > {MAX_PHASE_FRAGMENTS}"
                      )
          '''
          if old not in text:
              raise SystemExit("combined fragment anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_consumer_v3_fragment_compaction.py")
          test_path.write_text('''import unittest
          from unittest.mock import patch

          from rotation.consumer_v2 import _flatten_fragments
          from rotation.consumer_v3 import (
              FRAGMENT_TARGET_BYTES,
              MAX_PHASE_FRAGMENTS,
              _chunks,
              _compact_fragments,
              reconstruct_fragments,
          )
          from rotation.provenance import canonical_bytes
          from rotation.validation import ContractError


          class ConsumerV3FragmentCompactionTests(unittest.TestCase):
              @staticmethod
              def identity():
                  return {
                      "analysis_id": "a" * 64,
                      "generation_id": "b" * 64,
                      "run_id": "c" * 64,
                      "source_commit": "d" * 40,
                      "source_sha256": "e" * 64,
                      "data_date": "2026-08-01",
                      "status": "success",
                      "generated_at": "2026-08-01T00:00:00Z",
                      "valid_until": "2026-08-08T00:00:00Z",
                      "hard_stop_after": "2026-08-15T00:00:00Z",
                      "timezone": "UTC",
                  }

              @staticmethod
              def production_sized_phase():
                  assessments = []
                  for theme_index in range(40):
                      assessments.append(
                          {
                              "theme_id": f"theme_{theme_index:02d}",
                              "theme_display_name": f"Theme {theme_index:02d}",
                              "display_metric": {
                                  f"metric_{metric_index:02d}": (
                                      theme_index + metric_index
                                  ) / 1000
                                  for metric_index in range(35)
                              },
                              "threshold_assessment": {
                                  f"flag_{flag_index:02d}": flag_index % 2 == 0
                                  for flag_index in range(10)
                              },
                              "history": [
                                  {
                                      "week": week,
                                      "value": (theme_index + week) / 100,
                                  }
                                  for week in range(4)
                              ],
                          }
                      )
                  return {
                      "phase": 1,
                      "data_date_display": "2026-08-01",
                      "generated_at_display": "2026-08-01T00:00:00Z",
                      "analysis_mode_display": "trend",
                      "flow_notice": "observed price and breadth flow proxy",
                      "coverage": {
                          "configured_theme_count": 40,
                          "assessed_theme_count": 40,
                      },
                      "theme_assessments": assessments,
                  }

              def test_large_phase_compacts_without_information_loss(self):
                  view = self.production_sized_phase()
                  leaf_fragments = _flatten_fragments(view)
                  self.assertGreater(len(leaf_fragments), MAX_PHASE_FRAGMENTS)

                  compact = _compact_fragments(view)
                  self.assertLessEqual(len(compact), MAX_PHASE_FRAGMENTS)
                  self.assertTrue(
                      all(
                          len(canonical_bytes(fragment))
                          <= FRAGMENT_TARGET_BYTES
                          for fragment in compact
                      )
                  )

                  chunks = _chunks(view, self.identity(), "phase", 1)
                  fragments = [
                      fragment
                      for chunk in chunks
                      for fragment in chunk["fragments"]
                  ]
                  self.assertEqual(reconstruct_fragments(fragments), view)
                  self.assertLessEqual(len(chunks), 8)

              def test_fragment_limit_error_names_kind_phase_and_count(self):
                  fragments = [
                      {"field": f"/items/{index}", "value": index}
                      for index in range(MAX_PHASE_FRAGMENTS + 1)
                  ]
                  with patch(
                      "rotation.consumer_v3._compact_fragments",
                      return_value=fragments,
                  ):
                      with self.assertRaisesRegex(
                          ContractError,
                          r"phase fragment limit exceeded for phase 4: "
                          r"1001 > 1000",
                      ):
                          _chunks({}, self.identity(), "phase", 4)


          if __name__ == "__main__":
              unittest.main()
          ''', encoding="utf-8")
          PY
          python -m compileall -q rotation tests
          python -m unittest tests.test_consumer_v3_fragment_compaction -v
          rm .github/workflows/apply-consumer-v3-fragment-compaction.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rotation/consumer_v3.py tests/test_consumer_v3_fragment_compaction.py .github/workflows/apply-consumer-v3-fragment-compaction.yml
          git commit -m "Compact consumer v3 fragments losslessly"
          git push origin HEAD:fix/consumer-v3-fragment-compaction
