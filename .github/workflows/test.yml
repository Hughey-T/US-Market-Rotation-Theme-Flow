name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apply-test-cleanup-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/consumer-v3-fragment-compaction'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consumer-v3-fragment-compaction
          fetch-depth: 0
      - name: Patch cleanup and remove this temporary job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_lock_and_workflow_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def make_repo(self):
              temporary = tempfile.TemporaryDirectory(); repo = Path(temporary.name)
              self.git(repo, "init", "-b", "main")
          '''
          new = '''    def make_repo(self):
              temporary = tempfile.TemporaryDirectory(
                  ignore_cleanup_errors=True
              )
              repo = Path(temporary.name)
              self.git(repo, "init", "-b", "main")
              self.git(repo, "config", "gc.auto", "0")
              self.git(repo, "config", "maintenance.auto", "false")
          '''
          if old not in text:
              raise SystemExit("make_repo anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/test_lock_and_workflow_contract.py .github/workflows/test.yml
          git commit -m "Harden temporary Git test cleanup"
          git push origin HEAD:fix/consumer-v3-fragment-compaction

  schema-and-canonical-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_repository.py
      - name: Validate immutable judgments against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_immutable_judgments.py --base "$BASE_SHA"
      - run: python scripts/generate_weekly.py --fixture tests/fixtures/latest_normal.json --dry-run
      - run: python -m unittest tests.test_condition_audit tests.test_immutable_judgments -v

  unit-and-rule-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q rotation scripts tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/validate_repository.py

  pipeline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_pipeline_contract tests.test_generation_e2e -v

  production-orchestration-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_production_orchestration_e2e -v

  repository-operations-and-transactional-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_publication_contract tests.test_consumer_projection tests.test_membership_contract -v

  judgment-projection-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_judgment_projection -v

  publication-recovery-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_publication_hardening -v

  workflow-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_lock_and_workflow_contract -v
