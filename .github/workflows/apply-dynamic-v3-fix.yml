name: apply-dynamic-v3-fix

on:
  push:
    branches:
      - fix/dynamic-industry-v3-handoff
    paths:
      - .github/workflows/apply-dynamic-v3-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dynamic-industry-v3-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          analysis = Path("rotation/analysis_v3.py")
          text = analysis.read_text(encoding="utf-8")

          anchor = '''def _themes(snapshot: dict) -> list[tuple[str, dict]]:
              return sorted((snapshot.get("themes") or {}).items())
          '''
          helper = '''def _themes(snapshot: dict) -> list[tuple[str, dict]]:
              return sorted((snapshot.get("themes") or {}).items())


          def _dynamic_signal_themes(snapshot: dict) -> dict[str, dict]:
              """Project dynamic industries into the existing price-signal contract.

              Dynamic industries remain outside fixed-theme assessments and coverage.
              This projection exists only so producer-selected company candidates can
              receive an authoritative, auditable handoff without inventing values.
              """
              bucket_by_id: dict[str, str] = {}
              buckets = snapshot.get("candidate_buckets") or {}
              for bucket in ("research_now", "watch_recovery", "long_term_context_price_weak", "avoid_now"):
                  for item in buckets.get(bucket) or []:
                      if item.get("source") != "dynamic_industry" or not item.get("id"):
                          continue
                      theme_id = item["id"]
                      previous = bucket_by_id.get(theme_id)
                      if previous is not None and previous != bucket:
                          raise ValueError(f"dynamic industry appears in multiple buckets: {theme_id}")
                      bucket_by_id[theme_id] = bucket

              candidates = ((snapshot.get("dynamic_discovery") or {}).get("candidates") or {})
              projected: dict[str, dict] = {}
              for theme_id, bucket in sorted(bucket_by_id.items()):
                  candidate = candidates.get(theme_id)
                  if not isinstance(candidate, dict):
                      raise ValueError(f"dynamic industry candidate is missing: {theme_id}")
                  eligible = candidate.get("eligible") is True
                  projected[theme_id] = {
                      "label": candidate.get("label") or theme_id,
                      "metrics": candidate.get("metrics") or {},
                      "quality": {
                          "classification_eligible": eligible,
                          "status": "eligible" if eligible else "ineligible",
                      },
                      "decision": {"candidate_bucket": bucket},
                      "constituents": candidate.get("constituents") or [],
                  }
              return projected
          '''
          if anchor not in text:
              raise SystemExit("_themes anchor not found")
          text = text.replace(anchor, helper, 1)

          old = '''    price_signals={tid:price_signal(theme) for tid,theme in themes}
              fundamentals={tid:fundamental_confirmation(fundamental_records.get(tid),price_signals[tid]["confirmed"] if price_signals[tid]["data_available"] else None) for tid,theme in themes}
          '''
          new = '''    price_signals={tid:price_signal(theme) for tid,theme in themes}
              dynamic_signal_themes=_dynamic_signal_themes(snapshot)
              candidate_price_signals={**price_signals, **{tid:price_signal(theme) for tid,theme in dynamic_signal_themes.items()}}
              fundamentals={tid:fundamental_confirmation(fundamental_records.get(tid),price_signals[tid]["confirmed"] if price_signals[tid]["data_available"] else None) for tid,theme in themes}
              candidate_fundamentals={**fundamentals, **{
                  tid:fundamental_confirmation(fundamental_records.get(tid),signal["confirmed"] if signal["data_available"] else None)
                  for tid,signal in candidate_price_signals.items() if tid not in fundamentals
              }}
          '''
          if old not in text:
              raise SystemExit("price signal anchor not found")
          text = text.replace(old, new, 1)

          old = '''    for theme_id,theme in themes:
                  for constituent in theme.get("constituents") or []: ticker_themes.setdefault(constituent.get("ticker"),[]).append(theme_id)
              for item in snapshot.get("company_candidates") or []:
          '''
          new = '''    for theme_id,theme in themes:
                  for constituent in theme.get("constituents") or []: ticker_themes.setdefault(constituent.get("ticker"),[]).append(theme_id)
              for theme_id,theme in dynamic_signal_themes.items():
                  for constituent in theme.get("constituents") or []: ticker_themes.setdefault(constituent.get("ticker"),[]).append(theme_id)
              for item in snapshot.get("company_candidates") or []:
          '''
          if old not in text:
              raise SystemExit("candidate ticker anchor not found")
          text = text.replace(old, new, 1)

          old = '''        theme_counts[tid]=theme_counts.get(tid,0)+1; fundamental_status=fundamentals.get(tid,{"status":"not_assessed"})["status"]
          '''
          new = '''        theme_counts[tid]=theme_counts.get(tid,0)+1; fundamental_status=candidate_fundamentals.get(tid,{"status":"not_assessed"})["status"]
          '''
          if old not in text:
              raise SystemExit("candidate fundamental anchor not found")
          text = text.replace(old, new, 1)

          old = '''    for c in candidates:
                  signal=price_signals[c["theme_id"]]
                  signal_status="not_available" if not signal["data_available"] else "confirmed" if signal["confirmed"] else "unconfirmed"
          '''
          new = '''    for c in candidates:
                  signal=candidate_price_signals.get(c["theme_id"])
                  if signal is None: raise ValueError(f"company candidate has no authoritative price signal: {c['theme_id']}")
                  signal_status="not_available" if not signal["data_available"] else "confirmed" if signal["confirmed"] else "unconfirmed"
          '''
          if old not in text:
              raise SystemExit("handoff signal anchor not found")
          text = text.replace(old, new, 1)
          analysis.write_text(text, encoding="utf-8")

          tests = Path("tests/test_v3_production_e2e.py")
          test_text = tests.read_text(encoding="utf-8")
          test_anchor = '''    def test_handoff_price_signal_unconfirmed_and_missing(self):
          '''
          test_method = '''    def test_dynamic_industry_candidate_gets_authoritative_handoff(self):
                  snapshot=self.production_snapshot(); dynamic_id="oil_gas_exploration"
                  metrics=copy.deepcopy(snapshot["themes"]["fixture_theme"]["metrics"])
                  metrics.update(equal_weight_rel_spy_4w=.08,advance_ratio_4w=.75,pct_above_50dma=.75)
                  snapshot["dynamic_discovery"]={"discovery_version":"2.0","thresholds":{},"candidate_ids":[dynamic_id],
                      "candidates":{dynamic_id:{"candidate_id":dynamic_id,"label":"Oil & Gas Exploration","source":"dynamic_industry",
                          "reference_etf":"XOP","reference_etf_rel_spy_4w":.09,"eligible":True,"rejection_reasons":[],
                          "structural_context":{"version":"1.0","status":"not_assessed","as_of":None,"summary":"not assessed","source_category":[]},
                          "metrics":metrics,"constituents":[{"ticker":"DYN","return_4w":.12,"rel_spy_4w":.10,"above_50dma":True,
                              "positive_contribution_ratio":.5,"dollar_volume_20d":10_000_000}]},"rejected":{}}
                  snapshot["candidate_buckets"]["research_now"].append(
                      {"id":dynamic_id,"label":"Oil & Gas Exploration","source":"dynamic_industry","classification_reason":"research_now"})
                  snapshot["company_candidates"]=[{"theme_id":dynamic_id,"theme_label":"Oil & Gas Exploration","source":"dynamic_industry",
                      "ticker":"DYN","company_name":"Dynamic Energy","company_name_source":"test","selection_role":"representative",
                      "why":"dynamic industry breadth","key_check":"check","counter_evidence":"counter","research_lens_source":"test"}]

                  projection=build_authoritative_v3(snapshot); handoff=projection["handoffs"][0]
                  self.assertEqual(handoff["theme_id"],dynamic_id)
                  self.assertEqual(handoff["candidate_bucket"],"research_now")
                  self.assertTrue(handoff["price_data_available"])
                  self.assertTrue(handoff["threshold_pass"])
                  self.assertTrue(handoff["breadth_pass"])
                  self.assertTrue(handoff["quality_pass"])
                  self.assertEqual(handoff["price_signal_status"],"confirmed")
                  self.assertEqual(projection["coverage"]["configured_theme_count"],len(snapshot["themes"]))
                  pointer,manifest,phases,details,handoffs=build_consumer_v3(snapshot)
                  self.assertEqual(pointer["identity"],manifest["identity"])
                  self.assertTrue(handoffs)

              def test_handoff_price_signal_unconfirmed_and_missing(self):
          '''
          if test_anchor not in test_text:
              raise SystemExit("test anchor not found")
          test_text = test_text.replace(test_anchor, test_method, 1)
          tests.write_text(test_text, encoding="utf-8")
          PY
          python -m compileall -q rotation tests
          python -m unittest tests.test_v3_production_e2e.V3ProductionE2E.test_dynamic_industry_candidate_gets_authoritative_handoff -v
          rm .github/workflows/apply-dynamic-v3-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rotation/analysis_v3.py tests/test_v3_production_e2e.py .github/workflows/apply-dynamic-v3-fix.yml
          git commit -m "Fix dynamic industry consumer v3 handoffs"
          git push origin HEAD:fix/dynamic-industry-v3-handoff
